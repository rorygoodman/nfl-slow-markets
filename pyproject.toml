[project]
name = "nfl-slow-markets"
version = "0.1.0"
description = "Polymarket-triggered NFL bookmaker value-bet alerting"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "playwright>=1.42"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
polymarket-monitor = "polymarket_monitor.poller:run"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_monitor", "src/paddypower_scraper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: live network test, opt-in via RUN_INTEGRATION=1",
]
